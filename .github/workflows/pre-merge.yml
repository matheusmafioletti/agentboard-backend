name: Pre-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Commit SHA to test against preview images
        required: true
      pr_number:
        description: PR number for QA report publishing
        required: false
        default: ""

concurrency:
  group: pre-merge-${{ github.event.workflow_run.head_sha || inputs.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read
  actions: read

env:
  REGISTRY: ghcr.io
  API_REPO: matheusmafioletti/agentboard-api-restassured
  E2E_PLAYWRIGHT_REPO: matheusmafioletti/agentboard-e2e-playwright
  E2E_CYPRESS_REPO: matheusmafioletti/agentboard-e2e-cypress
  E2E_SELENIUM_REPO: matheusmafioletti/agentboard-e2e-selenium
  QA_REPORTS_REPO: matheusmafioletti/agentboard-qa-reports

jobs:
  gate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.meta.outputs.head_sha }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      ci_run_id: ${{ steps.meta.outputs.ci_run_id }}

    steps:
      - name: Verify CI succeeded
        if: github.event_name == 'workflow_run'
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "Pre-merge skipped: CI concluded with ${CONCLUSION}" >&2
            exit 1
          fi

      - name: Resolve PR metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "head_sha=${{ inputs.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "ci_run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "ci_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            PRS='${{ toJson(github.event.workflow_run.pull_requests) }}'
            PR_NUMBER=$(echo "$PRS" | jq -r '.[0].number // empty')
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  resolve-preview:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      auth_tag: ${{ steps.meta.outputs.auth_tag }}
      board_tag: ${{ steps.meta.outputs.board_tag }}
      api_docs_tag: ${{ steps.meta.outputs.api_docs_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}

    steps:
      - name: Resolve preview image tags
        id: meta
        run: |
          SHA="${{ needs.gate.outputs.head_sha }}"
          echo "auth_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "board_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "api_docs_tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "web_tag=e2e-latest" >> "$GITHUB_OUTPUT"

      - name: Verify preview images on GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull preview images
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ needs.gate.outputs.head_sha }}"
          for image in agentboard-auth agentboard-board agentboard-api-docs; do
            docker pull "${{ env.REGISTRY }}/${OWNER}/${image}:${SHA}"
          done
          docker pull "${{ env.REGISTRY }}/${OWNER}/agentboard-web:e2e-latest"

  api-local-full:
    needs: [gate, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPO }}
          path: agentboard-api-restassured

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-api-restassured/pom.xml

      - name: Run full API test suite
        working-directory: agentboard-api-restassured
        run: |
          mvn test \
            -Denv=local \
            -Dbase.url.auth=http://localhost:8080 \
            -Dbase.url.board=http://localhost:8080 \
            -Dcucumber.filter.tags="not @wip"

      - name: Generate Allure report
        if: always()
        working-directory: agentboard-api-restassured
        run: mvn allure:report

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: agentboard-api-restassured/target/allure-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

  e2e-playwright:
    needs: [gate, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: agentboard-backend

      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_PLAYWRIGHT_REPO }}
          path: agentboard-e2e-playwright

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-playwright/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-playwright
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local -- --project=chromium

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-allure-results
          path: agentboard-e2e-playwright/allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: agentboard-e2e-playwright/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  e2e-cypress:
    needs: [gate, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: agentboard-backend

      - name: Checkout Cypress tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_CYPRESS_REPO }}
          path: agentboard-e2e-cypress

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-cypress/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-cypress
        run: npm ci

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-cypress
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-mochawesome
          path: agentboard-e2e-cypress/cypress/reports/
          retention-days: 30
          if-no-files-found: ignore

  e2e-selenium:
    needs: [gate, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          path: agentboard-backend

      - name: Checkout Selenium tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_SELENIUM_REPO }}
          path: agentboard-e2e-selenium

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-e2e-selenium/pom.xml

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local Selenium tests
        working-directory: agentboard-e2e-selenium
        env:
          ENVIRONMENT: e2e
        run: |
          mvn test -Pe2e \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dcucumber.filter.tags="@e2e and @local and not @wip"

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-allure-results
          path: agentboard-e2e-selenium/target/allure-results
          retention-days: 30
          if-no-files-found: ignore

  prepare-reports-payload:
    needs: [gate, api-local-full, e2e-playwright, e2e-cypress, e2e-selenium]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.payload.outputs.run_id }}
      results_json: ${{ steps.payload.outputs.results_json }}

    steps:
      - name: Build results payload
        id: payload
        run: |
          PR="${{ needs.gate.outputs.pr_number }}"
          SHA="${{ needs.gate.outputs.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_ID="backend-pr-${PR:-0}-${SHORT_SHA}"

          result() {
            if [[ "${1}" == "success" ]]; then echo "pass"; else echo "fail"; fi
          }

          cat > /tmp/results.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "results": {
              "api": "$(result '${{ needs.api-local-full.result }}')",
              "e2e-playwright": "$(result '${{ needs.e2e-playwright.result }}')",
              "e2e-cypress": "$(result '${{ needs.e2e-cypress.result }}')",
              "e2e-selenium": "$(result '${{ needs.e2e-selenium.result }}')"
            }
          }
          EOF

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "results_json=$(jq -c . /tmp/results.json)" >> "$GITHUB_OUTPUT"

  publish-reports-pr:
    needs: [gate, prepare-reports-payload]
    if: always() && needs.prepare-reports-payload.result != 'skipped'
    permissions:
      contents: write
    uses: matheusmafioletti/agentboard-qa-reports/.github/workflows/publish-report.yml@main
    with:
      run_id: ${{ needs.prepare-reports-payload.outputs.run_id }}
      sha: ${{ needs.gate.outputs.head_sha }}
      env: pr-local
      pr_number: ${{ needs.gate.outputs.pr_number }}
      results_json: ${{ needs.prepare-reports-payload.outputs.results_json }}
      source_repo: ${{ github.repository }}
      source_run_id: ${{ github.run_id }}
    secrets:
      QA_REPORTS_PAT: ${{ secrets.QA_REPORTS_PAT }}
      SOURCE_DOWNLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
