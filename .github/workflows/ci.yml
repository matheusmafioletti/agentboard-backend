name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  INFRA_REPO: matheusmafioletti/agentboard-infra
  API_REPO: matheusmafioletti/agentboard-api-restassured

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      auth_changed: ${{ steps.changes.outputs.auth }}
      board_changed: ${{ steps.changes.outputs.board }}
      api_docs_changed: ${{ steps.changes.outputs.api_docs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'auth-service/**'
              - 'commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            board:
              - 'board-service/**'
              - 'commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            api_docs:
              - 'api-docs-service/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Checkstyle (lint)
        run: ./gradlew checkstyleMain

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Test
        run: ./gradlew test jacocoRootReport jacocoCoverageCheck

      - name: JaCoCo Coverage Summary
        if: always()
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/commons/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/auth-service/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/board-service/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/api-docs-service/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '## Test Coverage'
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          update-comment: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/**
          if-no-files-found: ignore

      - name: Upload Pact contracts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: |
            **/pacts/*.json
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew build

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            image: agentboard-auth
            changed: ${{ needs.build.outputs.auth_changed }}
          - service: board-service
            image: agentboard-board
            changed: ${{ needs.build.outputs.board_changed }}
          - service: api-docs-service
            image: agentboard-api-docs
            changed: ${{ needs.build.outputs.api_docs_changed }}

    steps:
      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

      - name: Skip ${{ matrix.service }} (no changes)
        if: matrix.changed != 'true'
        run: echo "No changes in ${{ matrix.service }}, skipping image build."

  publish-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            image: agentboard-auth
          - service: board-service
            image: agentboard-board
          - service: api-docs-service
            image: agentboard-api-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  api-local-scoped:
    needs: [build, publish-preview]
    if: |
      github.event_name == 'pull_request' &&
      (needs.build.outputs.auth_changed == 'true' ||
       needs.build.outputs.board_changed == 'true' ||
       needs.build.outputs.api_docs_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Resolve Cucumber tag filter
        id: tags
        run: |
          AUTH="${{ needs.build.outputs.auth_changed }}"
          BOARD="${{ needs.build.outputs.board_changed }}"
          API_DOCS="${{ needs.build.outputs.api_docs_changed }}"

          if [[ "$AUTH" == "true" && "$BOARD" == "true" ]]; then
            FILTER="@auth or @board or @projects or @invites"
          elif [[ "$AUTH" == "true" ]]; then
            FILTER="@auth"
          elif [[ "$BOARD" == "true" ]]; then
            FILTER="@board or @projects"
          elif [[ "$API_DOCS" == "true" ]]; then
            FILTER="@smoke"
          else
            FILTER="not @wip"
          fi

          if [[ "$API_DOCS" == "true" && ("$AUTH" == "true" || "$BOARD" == "true") ]]; then
            FILTER="$FILTER or @smoke"
          fi

          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ github.sha }}
          board_tag: ${{ github.sha }}
          api_docs_tag: ${{ github.sha }}
          web_tag: e2e-latest
          action: up

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPO }}
          path: agentboard-api-restassured

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-api-restassured/pom.xml

      - name: Run scoped API tests
        working-directory: agentboard-api-restassured
        run: |
          mvn test \
            -Denv=local \
            -Dbase.url.auth=http://localhost:8080 \
            -Dbase.url.board=http://localhost:8080 \
            -Dcucumber.filter.tags="${{ steps.tags.outputs.filter }}"

      - name: Generate Allure report
        if: always()
        working-directory: agentboard-api-restassured
        run: mvn allure:report

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-scoped-allure-results
          path: agentboard-api-restassured/target/allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ github.sha }}
          board_tag: ${{ github.sha }}
          api_docs_tag: ${{ github.sha }}
          web_tag: e2e-latest
          action: down

  deploy:
    needs: [build, publish]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      (needs.build.outputs.auth_changed == 'true' ||
       needs.build.outputs.board_changed == 'true' ||
       needs.build.outputs.api_docs_changed == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
          repository: ${{ env.INFRA_REPO }}
          event-type: deploy-backend
          client-payload: |
            {
              "deploy_sha": "${{ github.sha }}",
              "auth_tag": "${{ needs.build.outputs.auth_changed == 'true' && github.sha || 'unchanged' }}",
              "board_tag": "${{ needs.build.outputs.board_changed == 'true' && github.sha || 'unchanged' }}",
              "api_docs_tag": "${{ needs.build.outputs.api_docs_changed == 'true' && github.sha || 'unchanged' }}"
            }

  production-simulation:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Simulate production release
        run: |
          echo "Production simulation — no deploy will be triggered."
          echo "Would publish and deploy with tags:"
          echo "  auth_tag: ${{ needs.build.outputs.auth_changed == 'true' && github.sha || 'unchanged' }}"
          echo "  board_tag: ${{ needs.build.outputs.board_changed == 'true' && github.sha || 'unchanged' }}"
          echo "  api_docs_tag: ${{ needs.build.outputs.api_docs_changed == 'true' && github.sha || 'unchanged' }}"
