name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_REPO: matheusmafioletti/agentboard-api-restassured
  E2E_PLAYWRIGHT_REPO: matheusmafioletti/agentboard-e2e-playwright
  E2E_CYPRESS_REPO: matheusmafioletti/agentboard-e2e-cypress
  E2E_SELENIUM_REPO: matheusmafioletti/agentboard-e2e-selenium
  QA_REPORTS_REPO: matheusmafioletti/agentboard-qa-reports

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      auth_changed: ${{ steps.changes.outputs.auth }}
      board_changed: ${{ steps.changes.outputs.board }}
      api_docs_changed: ${{ steps.changes.outputs.api_docs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'auth-service/**'
              - 'commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            board:
              - 'board-service/**'
              - 'commons/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
            api_docs:
              - 'api-docs-service/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Checkstyle (lint)
        run: ./gradlew checkstyleMain

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Test
        run: ./gradlew test jacocoRootReport jacocoCoverageCheck

      - name: JaCoCo Coverage Summary
        if: always()
        uses: Madrapps/jacoco-report@v1.7.1
        with:
          paths: |
            ${{ github.workspace }}/commons/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/auth-service/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/board-service/build/reports/jacoco/test/jacocoTestReport.xml,
            ${{ github.workspace }}/api-docs-service/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '## Test Coverage'
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          update-comment: true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/**
          if-no-files-found: ignore

      - name: Upload Pact contracts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: |
            **/pacts/*.json
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew build

  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            image: agentboard-auth
          - service: board-service
            image: agentboard-board
          - service: api-docs-service
            image: agentboard-api-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  api-local-scoped:
    needs: [build, publish-preview]
    if: |
      needs.build.outputs.auth_changed == 'true' ||
      needs.build.outputs.board_changed == 'true' ||
      needs.build.outputs.api_docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Resolve Cucumber tag filter
        id: tags
        run: |
          AUTH="${{ needs.build.outputs.auth_changed }}"
          BOARD="${{ needs.build.outputs.board_changed }}"
          API_DOCS="${{ needs.build.outputs.api_docs_changed }}"

          if [[ "$AUTH" == "true" && "$BOARD" == "true" ]]; then
            FILTER="@auth or @board or @projects or @invites"
          elif [[ "$AUTH" == "true" ]]; then
            FILTER="@auth"
          elif [[ "$BOARD" == "true" ]]; then
            FILTER="@board or @projects"
          elif [[ "$API_DOCS" == "true" ]]; then
            FILTER="@smoke"
          else
            FILTER="not @wip"
          fi

          if [[ "$API_DOCS" == "true" && ("$AUTH" == "true" || "$BOARD" == "true") ]]; then
            FILTER="$FILTER or @smoke"
          fi

          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ github.sha }}
          board_tag: ${{ github.sha }}
          api_docs_tag: ${{ github.sha }}
          web_tag: e2e-latest
          action: up

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPO }}
          path: agentboard-api-restassured

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-api-restassured/pom.xml

      - name: Run scoped API tests
        working-directory: agentboard-api-restassured
        run: |
          mvn test \
            -Denv=local \
            -Dbase.url.auth=http://localhost:8080 \
            -Dbase.url.board=http://localhost:8080 \
            -Dcucumber.filter.tags="${{ steps.tags.outputs.filter }}"

      - name: Generate Allure report
        if: always()
        working-directory: agentboard-api-restassured
        run: mvn allure:report

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-scoped-allure-results
          path: agentboard-api-restassured/target/allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ github.sha }}
          board_tag: ${{ github.sha }}
          api_docs_tag: ${{ github.sha }}
          web_tag: e2e-latest
          action: down

  resolve-preview:
    needs: [build, publish-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      auth_tag: ${{ steps.meta.outputs.auth_tag }}
      board_tag: ${{ steps.meta.outputs.board_tag }}
      api_docs_tag: ${{ steps.meta.outputs.api_docs_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}

    steps:
      - name: Resolve preview image tags
        id: meta
        run: |
          echo "auth_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "board_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "api_docs_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web_tag=e2e-latest" >> "$GITHUB_OUTPUT"

      - name: Verify preview images on GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull preview images
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA="${{ github.sha }}"
          for image in agentboard-auth agentboard-board agentboard-api-docs; do
            docker pull "${{ env.REGISTRY }}/${OWNER}/${image}:${SHA}"
          done
          docker pull "${{ env.REGISTRY }}/${OWNER}/agentboard-web:e2e-latest"

  api-local-full:
    needs: [build, publish-preview, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Start E2E stack
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Checkout API tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.API_REPO }}
          path: agentboard-api-restassured

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-api-restassured/pom.xml

      - name: Run full API test suite
        working-directory: agentboard-api-restassured
        run: |
          mvn test \
            -Denv=local \
            -Dbase.url.auth=http://localhost:8080 \
            -Dbase.url.board=http://localhost:8080 \
            -Dcucumber.filter.tags="not @wip"

      - name: Generate Allure report
        if: always()
        working-directory: agentboard-api-restassured
        run: mvn allure:report

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: agentboard-api-restassured/target/allure-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down E2E stack
        if: always()
        uses: ./.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

  e2e-playwright:
    needs: [build, publish-preview, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: agentboard-backend

      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_PLAYWRIGHT_REPO }}
          path: agentboard-e2e-playwright

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-playwright/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-playwright
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local -- --project=chromium

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-allure-results
          path: agentboard-e2e-playwright/allure-results/
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: agentboard-e2e-playwright/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  e2e-cypress:
    needs: [build, publish-preview, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: agentboard-backend

      - name: Checkout Cypress tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_CYPRESS_REPO }}
          path: agentboard-e2e-cypress

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentboard-e2e-cypress/package-lock.json

      - name: Install dependencies
        working-directory: agentboard-e2e-cypress
        run: npm ci

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local tests
        working-directory: agentboard-e2e-cypress
        env:
          ENVIRONMENT: e2e
          TEST_TAGS: "@local"
          CI: true
        run: npm run test:local

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-mochawesome
          path: agentboard-e2e-cypress/cypress/reports/
          retention-days: 30
          if-no-files-found: ignore

  e2e-selenium:
    needs: [build, publish-preview, resolve-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: agentboard-backend

      - name: Checkout Selenium tests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_SELENIUM_REPO }}
          path: agentboard-e2e-selenium

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: maven
          cache-dependency-path: agentboard-e2e-selenium/pom.xml

      - name: Start E2E stack
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: up

      - name: Run @local Selenium tests
        working-directory: agentboard-e2e-selenium
        env:
          ENVIRONMENT: e2e
        run: |
          mvn test -Pe2e \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dcucumber.filter.tags="@e2e and @local and not @wip"

      - name: Tear down E2E stack
        if: always()
        uses: ./agentboard-backend/.github/actions/e2e-stack
        with:
          auth_tag: ${{ needs.resolve-preview.outputs.auth_tag }}
          board_tag: ${{ needs.resolve-preview.outputs.board_tag }}
          api_docs_tag: ${{ needs.resolve-preview.outputs.api_docs_tag }}
          web_tag: ${{ needs.resolve-preview.outputs.web_tag }}
          action: down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-allure-results
          path: agentboard-e2e-selenium/target/allure-results
          retention-days: 30
          if-no-files-found: ignore

  publish-reports-pr:
    needs: [api-local-full, e2e-playwright, e2e-cypress, e2e-selenium]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Build results payload
        id: payload
        run: |
          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RUN_ID="backend-pr-${PR:-0}-${SHORT_SHA}"

          result() {
            if [[ "${1}" == "success" ]]; then echo "pass"; else echo "fail"; fi
          }

          cat > /tmp/results.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "results": {
              "api": "$(result '${{ needs.api-local-full.result }}')",
              "e2e-playwright": "$(result '${{ needs.e2e-playwright.result }}')",
              "e2e-cypress": "$(result '${{ needs.e2e-cypress.result }}')",
              "e2e-selenium": "$(result '${{ needs.e2e-selenium.result }}')"
            }
          }
          EOF

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "results_json=$(jq -c . /tmp/results.json)" >> "$GITHUB_OUTPUT"

      - name: Publish to QA reports portal
        uses: matheusmafioletti/agentboard-qa-reports/.github/workflows/publish-report.yml@main
        with:
          run_id: ${{ steps.payload.outputs.run_id }}
          sha: ${{ github.sha }}
          env: pr-local
          pr_number: ${{ github.event.pull_request.number }}
          results_json: ${{ steps.payload.outputs.results_json }}
          source_repo: ${{ github.repository }}
          source_run_id: ${{ github.run_id }}
        secrets:
          QA_REPORTS_PAT: ${{ secrets.QA_REPORTS_PAT }}
          SOURCE_DOWNLOAD_TOKEN: ${{ secrets.GITHUB_TOKEN }}
