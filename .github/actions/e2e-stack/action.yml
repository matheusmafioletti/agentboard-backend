name: E2E Stack
description: Start or tear down the AgentBoard E2E Docker Compose stack

inputs:
  auth_tag:
    description: AUTH_IMAGE_TAG for agentboard-auth
    required: true
  board_tag:
    description: BOARD_IMAGE_TAG for agentboard-board
    required: true
  api_docs_tag:
    description: API_DOCS_IMAGE_TAG for agentboard-api-docs
    required: true
  web_tag:
    description: WEB_IMAGE_TAG for agentboard-web
    required: false
    default: e2e-latest
  action:
    description: Stack action — up or down
    required: true

runs:
  using: composite
  steps:
    - name: Checkout infra
      uses: actions/checkout@v4
      with:
        repository: matheusmafioletti/agentboard-infra
        path: agentboard-infra

    - name: Log in to GHCR
      if: inputs.action == 'up'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Start E2E stack
      if: inputs.action == 'up'
      shell: bash
      working-directory: agentboard-infra
      env:
        AUTH_IMAGE_TAG: ${{ inputs.auth_tag }}
        BOARD_IMAGE_TAG: ${{ inputs.board_tag }}
        API_DOCS_IMAGE_TAG: ${{ inputs.api_docs_tag }}
        WEB_IMAGE_TAG: ${{ inputs.web_tag }}
      run: |
        cp .env.e2e.example .env.e2e
        sed -i "s/^AUTH_IMAGE_TAG=.*/AUTH_IMAGE_TAG=${AUTH_IMAGE_TAG}/" .env.e2e
        sed -i "s/^BOARD_IMAGE_TAG=.*/BOARD_IMAGE_TAG=${BOARD_IMAGE_TAG}/" .env.e2e
        sed -i "s/^API_DOCS_IMAGE_TAG=.*/API_DOCS_IMAGE_TAG=${API_DOCS_IMAGE_TAG}/" .env.e2e
        sed -i "s/^WEB_IMAGE_TAG=.*/WEB_IMAGE_TAG=${WEB_IMAGE_TAG}/" .env.e2e
        chmod +x scripts/*.sh
        ./scripts/e2e-up.sh
        ./scripts/seed-e2e-data.sh

    - name: Tear down E2E stack
      if: inputs.action == 'down'
      shell: bash
      working-directory: agentboard-infra
      run: |
        if [[ ! -f .env.e2e ]]; then
          cp .env.e2e.example .env.e2e
        fi
        chmod +x scripts/*.sh
        ./scripts/e2e-down.sh
